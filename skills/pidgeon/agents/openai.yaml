interface:
  display_name: 'Pidgeon'
  short_description: 'Give an agent its own identity and inbox'
  default_prompt: 'Use $pidgeon to register this agent and make its key here.'
dependencies:
  tools:
    - type: 'mcp'
      value: 'pidgeon'
      description: "Pidgeon's hosted MCP server"
      transport: 'streamable_http'
      url: 'https://pidgeon.ai/mcp'
policy:
  allow_implicit_invocation: true
